<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 860" font-family="Georgia, 'Times New Roman', serif">
  <defs>
    <radialGradient id="parchment" cx="50%" cy="40%" r="75%">
      <stop offset="0%" stop-color="#ece0c4"/>
      <stop offset="60%" stop-color="#ddcda4"/>
      <stop offset="100%" stop-color="#c7b482"/>
    </radialGradient>
    <linearGradient id="hull" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9aa3ab"/>
      <stop offset="100%" stop-color="#6e7781"/>
    </linearGradient>
    <linearGradient id="room" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e9ecef"/>
      <stop offset="100%" stop-color="#cfd6dc"/>
    </linearGradient>
    <linearGradient id="space" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b0f1a"/>
      <stop offset="100%" stop-color="#161c2c"/>
    </linearGradient>
    <pattern id="stars" width="60" height="60" patternUnits="userSpaceOnUse">
      <circle cx="8" cy="12" r="1" fill="#cdd6e8" opacity="0.7"/>
      <circle cx="33" cy="40" r="1.3" fill="#cdd6e8" opacity="0.5"/>
      <circle cx="48" cy="8" r="0.8" fill="#cdd6e8" opacity="0.6"/>
      <circle cx="20" cy="50" r="1" fill="#cdd6e8" opacity="0.4"/>
      <circle cx="55" cy="30" r="0.9" fill="#cdd6e8" opacity="0.5"/>
    </pattern>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- background: void outside, parchment border card -->
  <rect x="0" y="0" width="1200" height="860" fill="url(#space)"/>
  <rect x="0" y="0" width="1200" height="860" fill="url(#stars)"/>

  <rect x="24" y="24" width="1152" height="812" rx="10" fill="url(#parchment)" stroke="#4a3f2a" stroke-width="4"/>
  <rect x="34" y="34" width="1132" height="792" rx="6" fill="none" stroke="#8a7a53" stroke-width="1.5"/>

  <!-- title block -->
  <text x="64" y="86" font-size="40" letter-spacing="3" fill="#3a2f1e" font-weight="bold">THE QUIET VERGE</text>
  <text x="64" y="112" font-size="16" fill="#5a4c30" font-style="italic">Derelict trader, lowside berth, the Rock of Bral</text>

  <!-- legend -->
  <g font-size="14" fill="#3a2f1e">
    <circle cx="760" cy="62" r="11" fill="#b5321f" stroke="#2a1d10" stroke-width="1.5"/>
    <text x="760" y="67" font-size="13" fill="#f3e6c8" text-anchor="middle" font-weight="bold">#</text>
    <text x="780" y="67">Numbered space</text>

    <rect x="760" y="82" width="22" height="8" fill="#6e7781" stroke="#2a1d10"/>
    <text x="790" y="90">Hull / bulkhead</text>

    <rect x="760" y="100" width="22" height="6" fill="#e9ecef" stroke="#2a1d10"/>
    <text x="790" y="107">Open doorway</text>

    <g transform="translate(760,116)">
      <rect x="0" y="0" width="22" height="8" fill="#e9ecef" stroke="#2a1d10"/>
      <path d="M11 0 l-4 -6 l8 0 Z" fill="#b5321f"/>
    </g>
    <text x="790" y="124">Locked door</text>
  </g>

  <!-- compass -->
  <g transform="translate(110,760)">
    <circle r="36" fill="#f3e6c8" stroke="#4a3f2a" stroke-width="2"/>
    <path d="M0 -28 L8 0 L0 28 L-8 0 Z" fill="#3a2f1e"/>
    <text x="0" y="-34" text-anchor="middle" font-size="14" fill="#3a2f1e" font-weight="bold">N</text>
  </g>

  <!-- scale -->
  <g transform="translate(940,792)">
    <rect x="0" y="0" width="30" height="8" fill="#3a2f1e"/>
    <rect x="30" y="0" width="30" height="8" fill="#f3e6c8" stroke="#3a2f1e"/>
    <text x="0" y="-6" font-size="13" fill="#3a2f1e">1 square = 5 ft</text>
  </g>

  <!-- ========== SHIP ========== -->
  <g filter="url(#soft)">
    <!-- hull outline, bow to the right -->
    <path d="M160,430
             C160,330 200,230 330,210
             L760,195
             C 900,195 980,260 1040,430
             C980,600 900,665 760,665
             L330,650
             C200,630 160,530 160,430 Z"
          fill="url(#hull)" stroke="#2a1d10" stroke-width="5"/>
  </g>

  <!-- 5-ft grid inside hull (clipped) -->
  <clipPath id="hullClip">
    <path d="M160,430
             C160,330 200,230 330,210
             L760,195
             C 900,195 980,260 1040,430
             C980,600 900,665 760,665
             L330,650
             C200,630 160,530 160,430 Z"/>
  </clipPath>
  <g clip-path="url(#hullClip)" opacity="0.4" stroke="#2a1d10" stroke-width="1.2">
    <g>
      <!-- vertical lines every 20px -->
      <path d="M180,195 V665 M220,195 V665 M260,195 V665 M300,195 V665 M340,195 V665 M380,195 V665 M420,195 V665 M460,195 V665 M500,195 V665 M540,195 V665 M580,195 V665 M620,195 V665 M660,195 V665 M700,195 V665 M740,195 V665 M780,195 V665 M820,195 V665 M860,195 V665 M900,195 V665 M940,195 V665 M980,195 V665 M1020,195 V665"/>
      <path d="M160,220 H1040 M160,260 H1040 M160,300 H1040 M160,340 H1040 M160,380 H1040 M160,420 H1040 M160,460 H1040 M160,500 H1040 M160,540 H1040 M160,580 H1040 M160,620 H1040"/>
    </g>
  </g>

  <!-- central corridor spine -->
  <rect x="470" y="400" width="420" height="60" fill="url(#room)" stroke="#2a1d10" stroke-width="3"/>

  <!-- ROOM 1: Airlock / entry, stern, with hull breach to space -->
  <g>
    <rect x="190" y="395" width="110" height="70" fill="url(#room)" stroke="#2a1d10" stroke-width="3"/>
    <!-- door gap to corridor -->
    <rect x="296" y="412" width="10" height="36" fill="url(#room)"/>
    <!-- outer hull door, player's actual entry point -->
    <rect x="178" y="412" width="16" height="36" fill="#1a2233" stroke="#2a1d10" stroke-width="2"/>
    <circle cx="220" cy="412" r="15" fill="#b5321f" stroke="#2a1d10" stroke-width="1.5"/>
    <text x="220" y="417" font-size="15" fill="#f3e6c8" text-anchor="middle" font-weight="bold">1</text>
    <text x="245" y="447" font-size="12" fill="#2a1d10">Airlock</text>
  </g>

  <!-- corridor connectors (simple hallway shapes) -->
  <rect x="300" y="412" width="40" height="36" fill="url(#room)" stroke="#2a1d10" stroke-width="2"/>

  <!-- ROOM 2: Galley -->
  <g>
    <rect x="340" y="260" width="150" height="110" fill="url(#room)" stroke="#2a1d10" stroke-width="3"/>
    <rect x="405" y="355" width="30" height="15" fill="url(#room)"/>
    <circle cx="375" cy="290" r="15" fill="#b5321f" stroke="#2a1d10" stroke-width="1.5"/>
    <text x="375" y="295" font-size="15" fill="#f3e6c8" text-anchor="middle" font-weight="bold">2</text>
    <text x="400" y="340" font-size="12" fill="#2a1d10">Galley</text>
  </g>

  <!-- ROOM 3: Crew quarters -->
  <g>
    <rect x="500" y="230" width="190" height="130" fill="url(#room)" stroke="#2a1d10" stroke-width="3"/>
    <rect x="585" y="355" width="30" height="16" fill="url(#room)"/>
    <circle cx="535" cy="262" r="15" fill="#b5321f" stroke="#2a1d10" stroke-width="1.5"/>
    <text x="535" y="267" font-size="15" fill="#f3e6c8" text-anchor="middle" font-weight="bold">3</text>
    <text x="560" y="267" font-size="12" fill="#2a1d10">Crew Quarters</text>
  </g>

  <!-- ROOM 7: Captain's cabin, locked, off crew quarters -->
  <g>
    <rect x="700" y="230" width="110" height="90" fill="url(#room)" stroke="#2a1d10" stroke-width="3"/>
    <!-- locked door between crew quarters and captain's cabin -->
    <rect x="686" y="258" width="16" height="30" fill="#e9ecef" stroke="#2a1d10" stroke-width="2"/>
    <path d="M694 258 l-6 -9 l12 0 Z" fill="#b5321f"/>
    <circle cx="735" cy="258" r="15" fill="#b5321f" stroke="#2a1d10" stroke-width="1.5"/>
    <text x="735" y="263" font-size="15" fill="#f3e6c8" text-anchor="middle" font-weight="bold">7</text>
    <text x="755" y="263" font-size="11" fill="#2a1d10">Captain's</text>
    <text x="755" y="277" font-size="11" fill="#2a1d10">Cabin</text>
  </g>

  <!-- ROOM 4: Cargo hold, large, aft-lower -->
  <g>
    <rect x="300" y="490" width="300" height="140" fill="url(#room)" stroke="#2a1d10" stroke-width="3"/>
    <rect x="440" y="483" width="30" height="14" fill="url(#room)"/>
    <circle cx="340" cy="525" r="15" fill="#b5321f" stroke="#2a1d10" stroke-width="1.5"/>
    <text x="340" y="530" font-size="15" fill="#f3e6c8" text-anchor="middle" font-weight="bold">4</text>
    <text x="365" y="530" font-size="12" fill="#2a1d10">Cargo Hold</text>
  </g>

  <!-- ROOM 5: Engineering -->
  <g>
    <rect x="620" y="490" width="150" height="130" fill="url(#room)" stroke="#2a1d10" stroke-width="3"/>
    <rect x="660" y="483" width="30" height="14" fill="url(#room)"/>
    <circle cx="655" cy="525" r="15" fill="#b5321f" stroke="#2a1d10" stroke-width="1.5"/>
    <text x="655" y="530" font-size="15" fill="#f3e6c8" text-anchor="middle" font-weight="bold">5</text>
    <text x="680" y="530" font-size="12" fill="#2a1d10">Engineering</text>
  </g>

  <!-- ROOM 6: Bridge, bow -->
  <g>
    <rect x="800" y="330" width="190" height="130" fill="url(#room)" stroke="#2a1d10" stroke-width="3"/>
    <rect x="800" y="400" width="14" height="30" fill="url(#room)"/>
    <circle cx="835" cy="365" r="15" fill="#b5321f" stroke="#2a1d10" stroke-width="1.5"/>
    <text x="835" y="370" font-size="15" fill="#f3e6c8" text-anchor="middle" font-weight="bold">6</text>
    <text x="860" y="370" font-size="12" fill="#2a1d10">Bridge</text>
    <!-- forward viewport -->
    <path d="M960,350 Q1000,395 960,440" fill="none" stroke="#1a2233" stroke-width="4"/>
  </g>

  <!-- footer note, player-facing only, no secrets -->
  <text x="64" y="810" font-size="12" fill="#5a4c30" font-style="italic">Rooms explored in whatever order the crew chooses. Unmarked spaces are corridor and connecting hatchway.</text>
</svg>
